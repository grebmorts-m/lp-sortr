# Free Supabase projects pause after ~7 days without activity. This pings it daily.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.VITE_SUPABASE_URL != '' }}
    steps:
      - run: |
          curl -fsS "${{ vars.VITE_SUPABASE_URL }}/rest/v1/albums_entries?select=id&limit=1" \
            -H "apikey: ${{ vars.VITE_SUPABASE_ANON_KEY }}" -o /dev/null -w "%{http_code}\n"
